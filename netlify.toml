# netlify.toml - Configuration file for Netlify deployment
# Waffle Heaven Restaurant Website

# Build settings
[build]
  # Directory where your built files are located
  publish = "dist"
  
  # Build command for your frontend
  command = "npm run build"

# Environment variables
# Add these in the Netlify UI for sensitive values
[build.environment]
  NODE_VERSION = "18"

# Production context: all deploys from the main branch
[context.production]
  environment = { NODE_ENV = "production" }

# Deploy Preview context: all deploys generated from pull/merge requests
[context.deploy-preview]
  environment = { NODE_ENV = "development" }

# Branch Deploy context: all deploys that are not from pull/merge requests or main
[context.branch-deploy]
  environment = { NODE_ENV = "development" }

# Redirects and rewrites
[[redirects]]
  from = "/api/*"
  to = "https://waffle-heaven-api.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback - redirects all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers to set for all pages
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://res.cloudinary.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://waffle-heaven-api.railway.app;"

# Cache control for static assets
[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Specify proper MIME types for files
[[headers]]
  for = "*.js"
    [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "*.css"
    [headers.values]
    Content-Type = "text/css"